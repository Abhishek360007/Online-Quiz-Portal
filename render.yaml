# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the Docker image as a free web service. The database lives on Neon,
# so its connection details are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: online-quiz-portal
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Neon JDBC URL, e.g. jdbc:postgresql://ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
