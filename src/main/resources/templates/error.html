<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page narrow" style="text-align:center;padding-top:4rem">
    <p class="tile-value muted" th:text="${status}">Error</p>
    <h1 th:switch="${status}">
        <span th:case="404">That page doesn't exist.</span>
        <span th:case="403">You don't have access to that.</span>
        <span th:case="*">Something went wrong on our side.</span>
    </h1>
    <p class="mt"><a class="btn" th:href="@{/home}">Go home</a></p>
</main>
</body>
</html>
