<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page narrow" style="text-align:center;padding-top:5rem;padding-bottom:6rem">
    <div class="error-code" th:text="${status}">404</div>
    <h1 class="mt" th:switch="${status}">
        <span th:case="404">That page isn't here.</span>
        <span th:case="403">You don't have access to that.</span>
        <span th:case="*">Something went wrong on our side.</span>
    </h1>
    <p class="muted" th:switch="${status}">
        <span th:case="404">The link may be old, or the quiz may have been removed.</span>
        <span th:case="403">If you think this is a mistake, sign in with a different account.</span>
        <span th:case="*">Please try again in a moment.</span>
    </p>
    <p class="mt"><a class="btn accent" th:href="${me != null} ? @{/home} : @{/}">Take me home</a></p>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
</body>
</html>
