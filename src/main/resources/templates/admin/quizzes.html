<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head('Quizzes')}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page stack">
    <th:block th:replace="~{fragments/shell :: flash}"></th:block>

    <div class="spread">
        <h1>Quizzes</h1>
        <a class="btn" th:href="@{/admin/quizzes/create}">+ New quiz</a>
    </div>

    <section class="panel flush">
        <p class="muted" style="padding:1rem 1.25rem;margin:0" th:if="${#lists.isEmpty(quizzes)}">
            You haven't made any quizzes yet.
        </p>
        <div class="table-wrap" th:unless="${#lists.isEmpty(quizzes)}">
            <table>
                <thead><tr><th>Title</th><th>Topic</th><th>Questions</th><th>Time</th><th>Pass mark</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="q : ${quizzes}">
                    <td><a th:href="@{/admin/quizzes/{id}(id=${q.id})}" th:text="${q.title}"></a></td>
                    <td th:text="${q.topic}"></td>
                    <td th:text="${#lists.size(q.questions)}"></td>
                    <td th:text="${q.timeLimitMinutes} + ' min'"></td>
                    <td th:text="${q.passMark} + '%'"></td>
                    <td><span class="tag" th:classappend="${q.live} ? 'live'" th:text="${q.live} ? 'Live' : 'Draft'"></span></td>
                    <td class="right nowrap">
                        <a class="btn ghost small" th:href="@{/admin/quizzes/{id}(id=${q.id})}">Manage</a>
                        <a class="btn ghost small" th:href="@{/admin/quizzes/{id}/scores(id=${q.id})}">Scores</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
