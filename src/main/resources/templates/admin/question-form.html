<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head(${question == null} ? 'Add question' : 'Edit question')}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page narrow stack">
    <th:block th:replace="~{fragments/shell :: flash}"></th:block>
    <div>
        <a class="back" th:href="@{/admin/quizzes/{id}(id=${quiz.id})}">← <span th:text="${quiz.title}">Quiz</span></a>
        <div class="page-head">
            <span class="eyebrow" th:text="${quiz.title}">Quiz</span>
            <h1 th:text="${question == null} ? 'Add question' : 'Edit question'">Question</h1>
        </div>
    </div>

    <form class="sheet" method="post" novalidate th:object="${form}"
          th:action="${question == null} ? @{/admin/quizzes/{id}/questions/create(id=${quiz.id})} : @{/admin/questions/{id}(id=${question.id})}">

        <div class="field" th:classappend="${#fields.hasErrors('prompt')} ? 'has-error'">
            <label for="prompt">Question</label>
            <textarea id="prompt" rows="3" th:field="*{prompt}" placeholder="Write the question as students will see it"></textarea>
            <div class="error-text" th:errors="*{prompt}"></div>
        </div>

        <div class="field">
            <span class="label">Choices</span>
            <p class="hint" style="margin:0 0 .7rem">Fill in 2 to 6 choices. Click a letter to mark the correct one. Leave extra slots empty.</p>
            <div class="slot" th:each="c, i : *{choices}">
                <label class="slot-letter" th:title="'Mark ' + ${@ui.letter(i.index)} + ' as correct'">
                    <input type="radio" th:field="*{answerSlot}" th:value="${i.index}">
                    <span th:text="${@ui.letter(i.index)}">A</span>
                </label>
                <input class="input" th:field="*{choices[__${i.index}__]}"
                       th:placeholder="${i.count <= 2} ? 'Choice ' + ${@ui.letter(i.index)} : 'Choice ' + ${@ui.letter(i.index)} + ' (optional)'">
            </div>
            <div class="error-text" th:errors="*{enoughChoices}"></div>
            <div class="error-text" th:errors="*{answerMarked}"></div>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('explanation')} ? 'has-error'">
            <label for="explanation">Explanation</label>
            <textarea id="explanation" rows="3" th:field="*{explanation}"
                      placeholder="Why is the correct answer right? Students who get it wrong see this in their correction."></textarea>
            <div class="hint">Optional, but it's what makes the correction useful.</div>
            <div class="error-text" th:errors="*{explanation}"></div>
        </div>

        <div class="row">
            <button class="btn accent" type="submit">Save question</button>
            <button class="btn ghost" type="submit" name="next" value="another" th:if="${question == null}">Save and add another</button>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
</body>
</html>
