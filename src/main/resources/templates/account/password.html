<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head('Change password')}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page narrow stack">
    <div>
        <a class="back" th:href="@{/home}">← Home</a>
        <div class="page-head">
            <span class="eyebrow">Account</span>
            <h1>Change password</h1>
            <p class="muted">Signed in as <strong th:text="${me.email}">email</strong></p>
        </div>
    </div>

    <form class="sheet" method="post" novalidate th:action="@{/account/password}" th:object="${form}">
        <div class="field" th:classappend="${#fields.hasErrors('currentPassword')} ? 'has-error'">
            <label for="currentPassword">Current password</label>
            <input class="input" type="password" id="currentPassword" th:field="*{currentPassword}"
                   autocomplete="current-password" autofocus>
            <div class="error-text" th:errors="*{currentPassword}"></div>
        </div>

        <div class="grid-2">
            <div class="field" th:classappend="${#fields.hasErrors('newPassword') or #fields.hasErrors('newPasswordDifferent')} ? 'has-error'">
                <label for="newPassword">New password</label>
                <input class="input" type="password" id="newPassword" th:field="*{newPassword}" autocomplete="new-password">
                <div class="error-text" th:errors="*{newPassword}"></div>
                <div class="error-text" th:errors="*{newPasswordDifferent}"></div>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('newPasswordsMatch')} ? 'has-error'">
                <label for="repeatNewPassword">Repeat new password</label>
                <input class="input" type="password" id="repeatNewPassword" th:field="*{repeatNewPassword}" autocomplete="new-password">
                <div class="error-text" th:errors="*{newPasswordsMatch}"></div>
            </div>
        </div>
        <p class="hint" style="margin-top:-.4rem">At least 8 characters, including a number.</p>

        <button class="btn accent" type="submit">Change password</button>
    </form>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
</body>
</html>
