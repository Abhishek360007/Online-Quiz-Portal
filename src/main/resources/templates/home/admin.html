<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head('Admin home')}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page stack">
    <th:block th:replace="~{fragments/shell :: flash}"></th:block>

    <div class="spread page-head">
        <div>
            <span class="eyebrow">Admin</span>
            <h1>Good to see you, <span th:text="${me.displayName}">Admin</span></h1>
            <p class="muted">Here's how the portal is doing.</p>
        </div>
        <div class="row">
            <a class="btn accent" th:href="@{/admin/quizzes/create}">+ New quiz</a>
            <a class="btn ghost" th:href="@{/admin/quizzes}">Manage quizzes</a>
        </div>
    </div>

    <section class="stats">
        <div class="stat"><div class="stat-label">Quizzes</div><div class="stat-value" th:text="${quizTotal}">0</div></div>
        <div class="stat"><div class="stat-label">Live now</div><div class="stat-value" th:text="${liveTotal}">0</div></div>
        <div class="stat"><div class="stat-label">Students</div><div class="stat-value" th:text="${studentTotal}">0</div></div>
        <div class="stat"><div class="stat-label">Attempts</div><div class="stat-value" th:text="${attemptTotal}">0</div></div>
        <div class="stat"><div class="stat-label">Avg. score</div><div class="stat-value"><span th:text="${average}">0</span><small>%</small></div></div>
    </section>

    <section class="sheet flush">
        <div class="sheet-head"><h2>Latest attempts</h2></div>
        <div class="empty" th:if="${#lists.isEmpty(activity)}">Nobody has finished a quiz yet.</div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(activity)}">
            <table>
                <thead><tr><th>Student</th><th>Quiz</th><th>Score</th><th>Result</th><th>Finished</th><th></th></tr></thead>
                <tbody>
                <tr th:each="a : ${activity}">
                    <td><span class="person"><span class="avatar" th:text="${@ui.initials(a.student.displayName)}">AB</span><span th:text="${a.student.displayName}"></span></span></td>
                    <td th:text="${a.quiz.title}"></td>
                    <td class="score" th:text="${a.correctCount} + '/' + ${a.questionCount}"></td>
                    <td><span class="tag" th:classappend="${a.passed} ? 'good' : 'bad'" th:text="${a.percent} + '%'"></span></td>
                    <td class="nowrap faint" th:text="${#temporals.format(a.finishedAt, 'd MMM, HH:mm')}"></td>
                    <td class="right"><a class="btn ghost small" th:href="@{/attempt/{id}/review(id=${a.id})}">Open</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
</body>
</html>
