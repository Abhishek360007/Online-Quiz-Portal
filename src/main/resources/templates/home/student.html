<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head('Home')}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page stack">
    <th:block th:replace="~{fragments/shell :: flash}"></th:block>

    <div class="spread page-head">
        <div>
            <span class="eyebrow" th:text="${#temporals.format(#temporals.createNow(), 'EEEE, d MMMM')}">Today</span>
            <h1>Hi <span th:text="${me.displayName}">there</span>, ready for a quiz?</h1>
        </div>
        <a class="btn accent" th:href="@{/catalog}">Browse all quizzes →</a>
    </div>

    <section class="stats">
        <div class="stat"><div class="stat-label">Quizzes available</div><div class="stat-value" th:text="${liveTotal}">0</div></div>
        <div class="stat"><div class="stat-label">You've finished</div><div class="stat-value" th:text="${attemptTotal}">0</div></div>
        <div class="stat"><div class="stat-label">Your average</div><div class="stat-value"><span th:text="${average}">0</span><small>%</small></div></div>
    </section>

    <section th:unless="${#lists.isEmpty(suggestions)}">
        <div class="spread" style="margin-bottom:.9rem">
            <h2>Try something new</h2>
            <a class="small" th:href="@{/catalog}">See everything</a>
        </div>
        <div class="cards">
            <a class="qcard" th:each="q : ${suggestions}" th:href="@{/catalog/{id}(id=${q.id})}" th:style="'--h:' + ${@ui.hue(q.topic)}">
                <span class="go">→</span>
                <span class="chip" th:style="'--h:' + ${@ui.hue(q.topic)}" th:text="${q.topic}">Topic</span>
                <h3 th:text="${q.title}">Quiz</h3>
                <p th:if="${q.description}" th:text="${q.description}"></p>
                <div class="facts">
                    <span th:text="${#lists.size(q.questions)} + ' Qs'"></span>
                    <span th:text="${q.timeLimitMinutes} + ' min'"></span>
                    <span th:text="'pass ' + ${q.passMark} + '%'"></span>
                </div>
            </a>
        </div>
    </section>

    <section class="sheet flush">
        <div class="sheet-head"><h2>Your recent attempts</h2><a class="small" th:href="@{/my/attempts}" th:unless="${#lists.isEmpty(activity)}">Full history</a></div>
        <div class="empty" th:if="${#lists.isEmpty(activity)}">
            Nothing here yet. Your results will show up after your first quiz.
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(activity)}">
            <table>
                <thead><tr><th>Quiz</th><th>Score</th><th>Result</th><th>When</th><th></th></tr></thead>
                <tbody>
                <tr th:each="a : ${activity}">
                    <td>
                        <strong th:text="${a.quiz.title}"></strong><br>
                        <span class="chip" th:style="'--h:' + ${@ui.hue(a.quiz.topic)}" th:text="${a.quiz.topic}"></span>
                    </td>
                    <td class="score" th:text="${a.correctCount} + '/' + ${a.questionCount}"></td>
                    <td><span class="tag" th:classappend="${a.passed} ? 'good' : 'bad'" th:text="${a.passed} ? 'Passed · ' + ${a.percent} + '%' : 'Not yet · ' + ${a.percent} + '%'"></span></td>
                    <td class="nowrap faint" th:text="${#temporals.format(a.finishedAt, 'd MMM, HH:mm')}"></td>
                    <td class="right"><a class="btn ghost small" th:href="@{/attempt/{id}/review(id=${a.id})}">Review</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
</body>
</html>
