<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head('Home')}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page stack">
    <th:block th:replace="~{fragments/shell :: flash}"></th:block>

    <div class="spread">
        <div>
            <h1>Hi, <span th:text="${me.displayName}">Student</span> 👋</h1>
            <p class="muted">Ready for your next quiz?</p>
        </div>
        <a class="btn" th:href="@{/catalog}">Browse quizzes</a>
    </div>

    <section class="tiles">
        <div class="tile"><div class="tile-label">Quizzes available</div><div class="tile-value" th:text="${liveTotal}">0</div></div>
        <div class="tile"><div class="tile-label">You've finished</div><div class="tile-value" th:text="${attemptTotal}">0</div></div>
        <div class="tile"><div class="tile-label">Your average</div><div class="tile-value" th:text="${average} + '%'">0%</div></div>
    </section>

    <section class="panel flush">
        <div class="panel-title">Your recent attempts</div>
        <p class="muted" style="padding:1rem 1.25rem;margin:0" th:if="${#lists.isEmpty(activity)}">
            Nothing yet. <a th:href="@{/catalog}">Pick a quiz</a> to get started.
        </p>
        <div class="table-wrap" th:unless="${#lists.isEmpty(activity)}">
            <table>
                <thead><tr><th>Quiz</th><th>Score</th><th>Result</th><th>Finished</th><th></th></tr></thead>
                <tbody>
                <tr th:each="a : ${activity}">
                    <td th:text="${a.quiz.title}"></td>
                    <td th:text="${a.correctCount} + ' / ' + ${a.questionCount}"></td>
                    <td><span class="tag" th:classappend="${a.passed} ? 'good' : 'bad'" th:text="${a.passed} ? 'Passed' : 'Not passed'"></span></td>
                    <td class="nowrap" th:text="${#temporals.format(a.finishedAt, 'd MMM, HH:mm')}"></td>
                    <td class="right"><a class="btn ghost small" th:href="@{/attempt/{id}/review(id=${a.id})}">Review</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
