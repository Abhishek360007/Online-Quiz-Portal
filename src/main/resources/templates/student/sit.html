<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head(${attempt.quiz.title})}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>

<div class="sit-bar">
    <div class="sit-bar-inner">
        <div>
            <div class="sit-title" th:text="${attempt.quiz.title}">Quiz</div>
            <span class="faint small" data-tally>0 answered</span>
        </div>
        <span class="clock" data-clock th:attr="data-seconds=${secondsLeft}" title="Time left">--:--</span>
        <nav class="rail" aria-label="Jump to question">
            <a th:each="q, i : ${attempt.quiz.questions}" th:href="'#q-' + ${q.id}" th:attr="data-rail=${q.id}" th:text="${i.count}">1</a>
        </nav>
        <div class="progress"><span data-progress></span></div>
    </div>
</div>

<main class="page narrow">
    <form method="post" data-quiz-form
          th:action="@{/attempt/{id}(id=${attempt.id})}"
          th:attr="data-questions=${#lists.size(attempt.quiz.questions)}">

        <section class="qsheet" th:each="q, i : ${attempt.quiz.questions}" th:id="'q-' + ${q.id}" th:attr="data-question=${q.id}">
            <span class="q-num" th:text="'QUESTION ' + ${#numbers.formatInteger(i.count, 2)} + ' OF ' + ${#numbers.formatInteger(i.size, 2)}">QUESTION 01</span>
            <p class="q-prompt" th:text="${q.prompt}">Prompt</p>
            <label class="pick" th:each="c, ci : ${q.choices}">
                <input type="radio" th:name="'answer-' + ${q.id}" th:value="${ci.index}">
                <span class="bubble" th:text="${@ui.letter(ci.index)}">A</span>
                <span th:text="${c}">Choice</span>
            </label>
        </section>

        <div class="sheet row" style="justify-content:space-between">
            <span class="muted small">Check the numbers at the top: dark ones are answered.</span>
            <button class="btn accent big" type="submit">Submit answers</button>
        </div>
    </form>
</main>

<script th:src="@{/assets/timer.js}"></script>
</body>
</html>
