<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head(${attempt.quiz.title})}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>

<div class="sit-bar">
    <div class="sit-bar-inner">
        <div>
            <strong th:text="${attempt.quiz.title}">Quiz</strong>
            <span class="muted small" data-tally>0 answered</span>
        </div>
        <span class="clock" data-clock th:attr="data-seconds=${secondsLeft}">--:--</span>
    </div>
</div>

<main class="page narrow">
    <form method="post" data-quiz-form
          th:action="@{/attempt/{id}(id=${attempt.id})}"
          th:attr="data-questions=${#lists.size(attempt.quiz.questions)}">

        <section class="panel" style="margin-bottom:1rem" th:each="q, i : ${attempt.quiz.questions}">
            <p class="muted small" style="margin:0" th:text="'Question ' + ${i.count} + ' of ' + ${i.size}"></p>
            <h2 th:text="${q.prompt}">Prompt</h2>
            <label class="pick" th:each="c, ci : ${q.choices}">
                <input type="radio" th:name="'answer-' + ${q.id}" th:value="${ci.index}">
                <span th:text="${c}"></span>
            </label>
        </section>

        <button class="btn wide" type="submit">Submit answers</button>
    </form>
</main>

<script th:src="@{/assets/timer.js}"></script>
</body>
</html>
