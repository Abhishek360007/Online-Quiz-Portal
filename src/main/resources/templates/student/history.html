<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/shell :: head('My attempts')}"></head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page stack">
    <div class="page-head">
        <span class="eyebrow" th:text="${#lists.size(attempts)} + ' finished'">History</span>
        <h1>My attempts</h1>
        <p class="muted">Open any attempt to see your answers and the corrections.</p>
    </div>
    <section class="sheet flush">
        <div class="empty" th:if="${#lists.isEmpty(attempts)}">
            You haven't finished a quiz yet. <a th:href="@{/catalog}">Browse quizzes</a> to get started.
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(attempts)}">
            <table>
                <thead><tr><th>Quiz</th><th>Score</th><th>Mistakes</th><th>Result</th><th>Time</th><th>Finished</th><th></th></tr></thead>
                <tbody>
                <tr th:each="a : ${attempts}">
                    <td>
                        <strong th:text="${a.quiz.title}"></strong><br>
                        <span class="chip" th:style="'--h:' + ${@ui.hue(a.quiz.topic)}" th:text="${a.quiz.topic}"></span>
                    </td>
                    <td class="score" th:text="${a.correctCount} + '/' + ${a.questionCount}"></td>
                    <td class="score" th:text="${a.wrongCount + a.skippedCount}"></td>
                    <td><span class="tag" th:classappend="${a.passed} ? 'good' : 'bad'" th:text="${a.percent} + '%'"></span></td>
                    <td class="mono small" th:text="${a.durationText}"></td>
                    <td class="nowrap faint" th:text="${#temporals.format(a.finishedAt, 'd MMM yyyy, HH:mm')}"></td>
                    <td class="right"><a class="btn ghost small" th:href="@{/attempt/{id}/review(id=${a.id})}">Review</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
</body>
</html>
