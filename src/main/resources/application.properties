spring.application.name=online-quiz-portal
server.port=${PORT:8080}

# --- PostgreSQL (override with DB_URL / DB_USERNAME / DB_PASSWORD) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quiz_portal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- Connection pool: small, and allowed to empty out so a serverless
#     database (e.g. Neon free tier) can suspend while the app is idle ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# --- Views (cache on in Docker via SPRING_THYMELEAF_CACHE=true) ---
spring.thymeleaf.cache=false

# --- Health endpoint for Docker / hosting platforms ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Behind a proxy / load balancer ---
server.forward-headers-strategy=framework

# --- First admin account, created on startup when it does not exist ---
portal.admin.name=Portal Admin
portal.admin.email=${ADMIN_EMAIL:admin@quizportal.dev}
portal.admin.password=${ADMIN_PASSWORD:ChangeMe@2026}
